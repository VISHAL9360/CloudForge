name: CloudForge CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  terraform-ci:
    name: "1. Terraform Validation & Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/

      - name: Terraform Init
        run: |
          cd terraform/enviroments/dev
          terraform init -backend=false

      - name: Terraform Validate
        run: |
          cd terraform/enviroments/dev
          terraform validate

  ansible-lint:
    name: "2. Ansible Playbook Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible
        run: pip install ansible

      - name: Validate Ansible Structure
        run: |
          test -f ansible/playbooks/site.yml
          test -f ansible/ansible.cfg
          test -d ansible/roles

      - name: Check Ansible Syntax
        run: |
          cd ansible
          export ANSIBLE_CONFIG=ansible.cfg
          export ANSIBLE_ROLES_PATH=$PWD/roles
          mkdir -p ~/.ssh && touch ~/.ssh/k8s.pem
          ansible-playbook playbooks/site.yml --syntax-check -i inventories/production/hosts.ini

  k8s-manifests:
    name: "3. Kubernetes Manifests Validation"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Kubeval / Kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate K8s YAML Syntax
        run: |
          python3 -c "
          import os, glob, yaml
          manifests = glob.glob('k8s/**/*.yml', recursive=True)
          for m in manifests:
              with open(m) as f:
                  yaml.safe_load_all(f)
          print(f'Successfully validated {len(manifests)} Kubernetes manifests')
          "
